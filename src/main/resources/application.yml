spring:
  datasource:
    # mariadb-query-optimization 레포의 docker-compose 와 동일한 접속 정보(포트 3307, DB qopt)
    url: jdbc:mariadb://localhost:3307/qopt
    username: root
    password: rootpw
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none          # 스키마/데이터는 mariadb-query-optimization 레포에서 생성·적재
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
    open-in-view: false
    show-sql: true

server:
  port: 8080
